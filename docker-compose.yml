services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smokestack
      POSTGRES_USER: smokestack
      POSTGRES_PASSWORD: smokestack
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smokestack -d smokestack"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://smokestack:smokestack@postgres:5432/smokestack
      REDIS_URL: redis://redis:6379
      ARTIFACT_DIR: /artifacts
      PORT: 3000
    volumes:
      - artifacts:/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    environment:
      DATABASE_URL: postgresql://smokestack:smokestack@postgres:5432/smokestack
      REDIS_URL: redis://redis:6379
      ARTIFACT_DIR: /artifacts
      CONCURRENCY: "2"
      WEBHOOK_URL: ""  # set to a Slack or generic webhook URL to enable notifications
    volumes:
      - artifacts:/artifacts
      - ./examples:/suites:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  artifacts:
