name: SmokeStack CI

# Runs on every push and PR to main.
# Builds the full stack, triggers a real test run, and asserts it passes —
# proving the platform itself works end-to-end.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Set up Docker Buildx (layer caching) ───────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Build images ──────────────────────────────────────────────────────
      # Runner build context is the project root (see docker-compose.yml)
      - name: Build Docker images
        run: docker compose build --parallel

      # ── 4. Start the stack ───────────────────────────────────────────────────
      - name: Start stack
        run: docker compose up -d

      # ── 5. Wait for API to be healthy ─────────────────────────────────────
      - name: Wait for API health
        run: |
          echo "Waiting for API..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "API is up"
              break
            fi
            echo "  attempt $i — HTTP $STATUS"
            sleep 3
          done
          curl -sf http://localhost:3000/api/health | jq .

      # ── 6. Verify suites endpoint ──────────────────────────────────────────
      - name: Check available suites
        run: |
          SUITES=$(curl -sf http://localhost:3000/api/suites)
          echo "$SUITES" | jq .
          echo "$SUITES" | jq -e 'length > 0' > /dev/null

      # ── 7. Trigger newman-demo run ─────────────────────────────────────────
      - name: Trigger newman-demo run
        id: trigger
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:3000/api/runs \
            -H "Content-Type: application/json" \
            -d '{"suite":"newman-demo","environment":"ci"}')
          echo "$RESPONSE" | jq .
          RUN_ID=$(echo "$RESPONSE" | jq -r .id)
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Triggered run: $RUN_ID"

      # ── 8. Poll until complete ─────────────────────────────────────────────
      - name: Wait for run to complete
        id: poll
        run: |
          RUN_ID="${{ steps.trigger.outputs.run_id }}"
          echo "Polling run $RUN_ID..."

          for i in $(seq 1 40); do
            RUN=$(curl -sf "http://localhost:3000/api/runs/$RUN_ID")
            STATUS=$(echo "$RUN" | jq -r .status)
            echo "  [$i] status=$STATUS"

            if [ "$STATUS" = "passed" ] || [ "$STATUS" = "failed" ] || [ "$STATUS" = "error" ]; then
              echo "$RUN" | jq .
              echo "status=$STATUS" >> "$GITHUB_OUTPUT"
              echo "total=$(echo "$RUN" | jq -r '.total_tests // 0')"   >> "$GITHUB_OUTPUT"
              echo "passed=$(echo "$RUN" | jq -r '.passed_tests // 0')" >> "$GITHUB_OUTPUT"
              echo "failed=$(echo "$RUN" | jq -r '.failed_tests // 0')" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 5
          done

      # ── 9. Print results summary ───────────────────────────────────────────
      - name: Print results
        run: |
          RUN_ID="${{ steps.trigger.outputs.run_id }}"
          curl -sf "http://localhost:3000/api/runs/$RUN_ID" | jq '{
            id, suite, environment, status,
            total_tests, passed_tests, failed_tests,
            duration_ms
          }'

      # ── 10. Print run logs on failure ──────────────────────────────────────
      - name: Print run logs (on failure)
        if: steps.poll.outputs.status != 'passed'
        run: |
          RUN_ID="${{ steps.trigger.outputs.run_id }}"
          echo "=== Run log ==="
          curl -sf "http://localhost:3000/api/runs/$RUN_ID/logs" | jq -r .log_output

      # ── 11. Assert the run passed ──────────────────────────────────────────
      - name: Assert run passed
        run: |
          STATUS="${{ steps.poll.outputs.status }}"
          if [ "$STATUS" != "passed" ]; then
            echo "::error ::Run status was '$STATUS' — expected 'passed'"
            exit 1
          fi
          echo "All tests passed!"

      # ── 12. Trigger playwright-demo run ────────────────────────────────────
      - name: Trigger playwright-demo run
        id: pw_trigger
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:3000/api/runs \
            -H "Content-Type: application/json" \
            -d '{"suite":"playwright-demo","environment":"ci"}')
          echo "$RESPONSE" | jq .
          echo "run_id=$(echo "$RESPONSE" | jq -r .id)" >> "$GITHUB_OUTPUT"

      # ── 13. Poll playwright run ────────────────────────────────────────────
      - name: Wait for Playwright run to complete
        id: pw_poll
        run: |
          RUN_ID="${{ steps.pw_trigger.outputs.run_id }}"
          echo "Polling Playwright run $RUN_ID..."

          for i in $(seq 1 60); do
            RUN=$(curl -sf "http://localhost:3000/api/runs/$RUN_ID")
            STATUS=$(echo "$RUN" | jq -r .status)
            echo "  [$i] status=$STATUS"

            if [ "$STATUS" = "passed" ] || [ "$STATUS" = "failed" ] || [ "$STATUS" = "error" ]; then
              echo "$RUN" | jq .
              echo "status=$STATUS" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 8
          done

      # ── 14. Print Playwright logs on failure ───────────────────────────────
      - name: Print Playwright logs (on failure)
        if: steps.pw_poll.outputs.status != 'passed'
        run: |
          RUN_ID="${{ steps.pw_trigger.outputs.run_id }}"
          curl -sf "http://localhost:3000/api/runs/$RUN_ID/logs" | jq -r .log_output

      - name: Assert Playwright run passed
        run: |
          STATUS="${{ steps.pw_poll.outputs.status }}"
          if [ "$STATUS" != "passed" ]; then
            echo "::error ::Playwright run status was '$STATUS' — expected 'passed'"
            exit 1
          fi

      # ── 15. Trigger k6-demo run ────────────────────────────────────────────
      - name: Trigger k6-demo run
        id: k6_trigger
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:3000/api/runs \
            -H "Content-Type: application/json" \
            -d '{"suite":"k6-demo","environment":"ci"}')
          echo "$RESPONSE" | jq .
          echo "run_id=$(echo "$RESPONSE" | jq -r .id)" >> "$GITHUB_OUTPUT"

      # ── 16. Poll k6 run ────────────────────────────────────────────────────
      - name: Wait for k6 run to complete
        id: k6_poll
        run: |
          RUN_ID="${{ steps.k6_trigger.outputs.run_id }}"
          echo "Polling k6 run $RUN_ID..."

          for i in $(seq 1 30); do
            RUN=$(curl -sf "http://localhost:3000/api/runs/$RUN_ID")
            STATUS=$(echo "$RUN" | jq -r .status)
            echo "  [$i] status=$STATUS"

            if [ "$STATUS" = "passed" ] || [ "$STATUS" = "failed" ] || [ "$STATUS" = "error" ]; then
              echo "$RUN" | jq '{status, total_tests, passed_tests, failed_tests, duration_ms}'
              echo "status=$STATUS" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 5
          done

      # ── 17. Print k6 logs on failure ───────────────────────────────────────
      - name: Print k6 logs (on failure)
        if: steps.k6_poll.outputs.status != 'passed'
        run: |
          RUN_ID="${{ steps.k6_trigger.outputs.run_id }}"
          curl -sf "http://localhost:3000/api/runs/$RUN_ID/logs" | jq -r .log_output

      - name: Assert k6 run passed
        run: |
          STATUS="${{ steps.k6_poll.outputs.status }}"
          if [ "$STATUS" != "passed" ]; then
            echo "::error ::k6 run status was '$STATUS' — expected 'passed'"
            exit 1
          fi

      # ── 18. Trigger pactum-demo run ────────────────────────────────────────
      - name: Trigger pactum-demo run
        id: pactum_trigger
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:3000/api/runs \
            -H "Content-Type: application/json" \
            -d '{"suite":"pactum-demo","environment":"ci"}')
          echo "$RESPONSE" | jq .
          echo "run_id=$(echo "$RESPONSE" | jq -r .id)" >> "$GITHUB_OUTPUT"

      # ── 19. Poll pactum run ────────────────────────────────────────────────
      - name: Wait for pactum run to complete
        id: pactum_poll
        run: |
          RUN_ID="${{ steps.pactum_trigger.outputs.run_id }}"
          echo "Polling pactum run $RUN_ID..."

          for i in $(seq 1 30); do
            RUN=$(curl -sf "http://localhost:3000/api/runs/$RUN_ID")
            STATUS=$(echo "$RUN" | jq -r .status)
            echo "  [$i] status=$STATUS"

            if [ "$STATUS" = "passed" ] || [ "$STATUS" = "failed" ] || [ "$STATUS" = "error" ]; then
              echo "$RUN" | jq '{status, total_tests, passed_tests, failed_tests, duration_ms}'
              echo "status=$STATUS" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 5
          done

      # ── 20. Print pactum logs on failure ───────────────────────────────────
      - name: Print pactum logs (on failure)
        if: steps.pactum_poll.outputs.status != 'passed'
        run: |
          RUN_ID="${{ steps.pactum_trigger.outputs.run_id }}"
          curl -sf "http://localhost:3000/api/runs/$RUN_ID/logs" | jq -r .log_output

      - name: Assert pactum run passed
        run: |
          STATUS="${{ steps.pactum_poll.outputs.status }}"
          if [ "$STATUS" != "passed" ]; then
            echo "::error ::pactum-demo run status was '$STATUS' — expected 'passed'"
            exit 1
          fi

      # ── 22. Show all runs in DB ────────────────────────────────────────────
      - name: Show all runs
        if: always()
        run: |
          echo "=== All runs ==="
          curl -sf http://localhost:3000/api/runs | jq '.runs[] | {id: .id[0:8], suite, status, passed_tests, failed_tests, duration_ms}'

      # ── 19. Print docker logs on failure ──────────────────────────────────
      - name: Docker logs (on failure)
        if: failure()
        run: |
          echo "=== API logs ==="
          docker compose logs api --tail=50
          echo "=== Runner logs ==="
          docker compose logs runner --tail=100

      # ── 20. Tear down ──────────────────────────────────────────────────────
      - name: Tear down
        if: always()
        run: docker compose down -v

  # ─────────────────────────────────────────────────────────────────────────────
  # Kubernetes job — proves the k8s/ manifests actually work.
  # Creates a real kind cluster, loads the built images, applies all manifests,
  # then runs the newman-demo suite as a smoke test.
  # ─────────────────────────────────────────────────────────────────────────────
  k8s-test:
    name: Kubernetes smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Install kind ──────────────────────────────────────────────────────
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      # ── 3. Create cluster ────────────────────────────────────────────────────
      # Uses k8s/kind-config.yaml: 1 control-plane + 3 workers.
      - name: Create kind cluster
        run: kind create cluster --name smokestack --config k8s/kind-config.yaml

      # ── 4. Install KEDA ──────────────────────────────────────────────────────
      # KEDA watches the BullMQ Redis queue and scales the runner Deployment
      # from 0 → N replicas as jobs are enqueued, back to 0 when queue empties.
      - name: Install KEDA
        run: |
          helm repo add kedacore https://kedacore.github.io/charts
          helm repo update
          helm install keda kedacore/keda \
            --namespace keda \
            --create-namespace \
            --wait \
            --timeout 120s

      # ── 5. Build images ──────────────────────────────────────────────────────
      # Runner build context is project root so examples/ can be COPY'd in.
      - name: Build Docker images
        run: |
          docker build -t smokestack-api:latest ./api
          docker build -t smokestack-runner:latest -f runner/Dockerfile .

      # ── 6. Load images into the cluster ──────────────────────────────────────
      # kind clusters have no access to the host's Docker daemon image store,
      # so images must be explicitly loaded.
      - name: Load images into kind
        run: |
          kind load docker-image smokestack-api:latest --name smokestack
          kind load docker-image smokestack-runner:latest --name smokestack

      # ── 7. Apply manifests ───────────────────────────────────────────────────
      # Order matters: namespace and storage first, then dependencies (pg, redis),
      # then the application tier. Skip ingress — not needed for CI.
      # keda-scaler.yaml is applied last — it requires the runner Deployment to exist.
      - name: Apply manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/rbac.yaml
          kubectl apply -f k8s/storage.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/api.yaml
          kubectl apply -f k8s/runner.yaml
          kubectl apply -f k8s/keda-scaler.yaml

      # ── 8. Wait for all workloads to be ready ────────────────────────────────
      # Runner starts at 0 replicas — KEDA scales it up once jobs are queued.
      - name: Wait for workloads ready
        run: |
          kubectl rollout status statefulset/postgres         -n smokestack --timeout=120s
          kubectl rollout status deployment/redis             -n smokestack --timeout=60s
          kubectl rollout status deployment/smokestack-api    -n smokestack --timeout=120s
          kubectl rollout status deployment/smokestack-runner -n smokestack --timeout=120s

      # ── 9. Show cluster topology ─────────────────────────────────────────────
      - name: Show cluster topology
        run: |
          echo "=== Nodes ==="
          kubectl get nodes -o wide
          echo ""
          echo "=== Pods across cluster ==="
          kubectl get pods -n smokestack -o wide

      # ── 10. Port-forward API to localhost ───────────────────────────────────
      - name: Port-forward API
        run: |
          kubectl port-forward svc/smokestack-api-svc 3000:80 -n smokestack &
          sleep 3

      # ── 11. Wait for API health ──────────────────────────────────────────────
      - name: Wait for API health
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "API is up"
              break
            fi
            echo "  attempt $i — HTTP $STATUS"
            sleep 3
          done
          curl -sf http://localhost:3000/api/health | jq .

      # ── 12. Trigger all 3 suites simultaneously ──────────────────────────────
      # Each runner replica picks up one job — all three suites execute in parallel.
      - name: Trigger all suites
        id: trigger
        run: |
          trigger() {
            curl -sf -X POST http://localhost:3000/api/runs \
              -H "Content-Type: application/json" \
              -d "{\"suite\":\"$1\",\"environment\":\"ci\"}" | jq -r .id
          }

          NEWMAN_ID=$(trigger newman-demo)
          PW_ID=$(trigger playwright-demo)
          K6_ID=$(trigger k6-demo)
          PACTUM_ID=$(trigger pactum-demo)

          echo "newman-demo:     $NEWMAN_ID"
          echo "playwright-demo: $PW_ID"
          echo "k6-demo:         $K6_ID"
          echo "pactum-demo:     $PACTUM_ID"

          echo "newman_id=$NEWMAN_ID"     >> "$GITHUB_OUTPUT"
          echo "pw_id=$PW_ID"             >> "$GITHUB_OUTPUT"
          echo "k6_id=$K6_ID"             >> "$GITHUB_OUTPUT"
          echo "pactum_id=$PACTUM_ID"     >> "$GITHUB_OUTPUT"

      # ── 12. Watch KEDA scale up ───────────────────────────────────────────────
      # KEDA detects the 4 queued jobs and scales the runner from 0 → 4 replicas.
      - name: Watch KEDA scale up
        run: |
          echo "Waiting for KEDA to scale runner from 0..."
          for i in $(seq 1 24); do
            READY=$(kubectl get deployment smokestack-runner -n smokestack \
              -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
            echo "  [${i}] ready replicas: ${READY:-0}"
            [ "${READY:-0}" -ge "4" ] && echo "Scaled to 4 runners!" && break
            sleep 5
          done
          echo ""
          echo "=== ScaledObject status ==="
          kubectl get scaledobject smokestack-runner-scaler -n smokestack
          echo ""
          echo "=== Runner pods ==="
          kubectl get pods -l app=smokestack-runner -n smokestack -o wide

      # ── 13. Poll all 3 runs concurrently ─────────────────────────────────────
      - name: Wait for all runs to complete
        id: poll
        run: |
          poll_run() {
            local ID=$1 NAME=$2
            for i in $(seq 1 60); do
              RUN=$(curl -sf "http://localhost:3000/api/runs/$ID")
              STATUS=$(echo "$RUN" | jq -r .status)
              echo "  [$NAME:$i] $STATUS"
              case "$STATUS" in
                passed|failed|error)
                  echo "$RUN" > "/tmp/ss_${NAME}"
                  return 0
                  ;;
              esac
              sleep 5
            done
            echo '{"status":"timeout"}' > "/tmp/ss_${NAME}"
          }

          poll_run "${{ steps.trigger.outputs.newman_id }}"  newman     &
          poll_run "${{ steps.trigger.outputs.pw_id }}"      playwright &
          poll_run "${{ steps.trigger.outputs.k6_id }}"      k6         &
          poll_run "${{ steps.trigger.outputs.pactum_id }}"  pactum     &
          wait

          echo ""
          echo "=== Results ==="
          for name in newman playwright k6 pactum; do
            jq -c '{suite, status, passed_tests, failed_tests, duration_ms}' "/tmp/ss_${name}"
          done

          NEWMAN_STATUS=$(jq  -r .status /tmp/ss_newman)
          PW_STATUS=$(jq      -r .status /tmp/ss_playwright)
          K6_STATUS=$(jq      -r .status /tmp/ss_k6)
          PACTUM_STATUS=$(jq  -r .status /tmp/ss_pactum)

          echo "newman_status=$NEWMAN_STATUS"   >> "$GITHUB_OUTPUT"
          echo "pw_status=$PW_STATUS"           >> "$GITHUB_OUTPUT"
          echo "k6_status=$K6_STATUS"           >> "$GITHUB_OUTPUT"
          echo "pactum_status=$PACTUM_STATUS"   >> "$GITHUB_OUTPUT"

      # ── 14. Print logs for any failed suites ─────────────────────────────────
      - name: Print run logs (on failure)
        if: steps.poll.outputs.newman_status != 'passed' || steps.poll.outputs.pw_status != 'passed' || steps.poll.outputs.k6_status != 'passed' || steps.poll.outputs.pactum_status != 'passed'
        run: |
          print_logs() {
            local ID=$1 NAME=$2 STATUS=$3
            if [ "$STATUS" != "passed" ]; then
              echo "=== $NAME logs (status: $STATUS) ==="
              curl -sf "http://localhost:3000/api/runs/$ID/logs" | jq -r .log_output
            fi
          }
          print_logs "${{ steps.trigger.outputs.newman_id }}"  newman     "${{ steps.poll.outputs.newman_status }}"
          print_logs "${{ steps.trigger.outputs.pw_id }}"      playwright "${{ steps.poll.outputs.pw_status }}"
          print_logs "${{ steps.trigger.outputs.k6_id }}"      k6         "${{ steps.poll.outputs.k6_status }}"
          print_logs "${{ steps.trigger.outputs.pactum_id }}"  pactum     "${{ steps.poll.outputs.pactum_status }}"

      # ── 15. Assert all suites passed ─────────────────────────────────────────
      - name: Assert all suites passed
        run: |
          FAILED=0
          [ "${{ steps.poll.outputs.newman_status }}"    != "passed" ] && echo "::error::newman-demo: ${{ steps.poll.outputs.newman_status }}"    && FAILED=1
          [ "${{ steps.poll.outputs.pw_status }}"        != "passed" ] && echo "::error::playwright-demo: ${{ steps.poll.outputs.pw_status }}"    && FAILED=1
          [ "${{ steps.poll.outputs.k6_status }}"        != "passed" ] && echo "::error::k6-demo: ${{ steps.poll.outputs.k6_status }}"            && FAILED=1
          [ "${{ steps.poll.outputs.pactum_status }}"    != "passed" ] && echo "::error::pactum-demo: ${{ steps.poll.outputs.pactum_status }}"    && FAILED=1
          [ "$FAILED" = "0" ] && echo "All 4 suites passed on Kubernetes!" || exit 1

      # ── 16. Cluster diagnostics on failure ───────────────────────────────────
      - name: Cluster diagnostics (on failure)
        if: failure()
        run: |
          echo "=== Nodes ==="
          kubectl get nodes -o wide
          echo "=== Pods ==="
          kubectl get pods -n smokestack -o wide
          echo "=== API logs ==="
          kubectl logs -l app=smokestack-api -n smokestack --tail=50 || true
          echo "=== Runner logs ==="
          kubectl logs -l app=smokestack-runner -n smokestack --tail=100 || true

      # ── 17. Tear down ────────────────────────────────────────────────────────
      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name smokestack
