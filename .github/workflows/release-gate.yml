name: Release Gate (SmokeStack example)

# ─────────────────────────────────────────────────────────────────────────────
# TEMPLATE — copy this into any project that has SmokeStack deployed.
#
# This workflow shows how to use SmokeStack as a release gate:
#   1. Deploy your application to a target environment
#   2. Trigger a test suite via the SmokeStack API
#   3. Poll until the run completes
#   4. Fail the pipeline if any tests failed — blocking the release
#
# Required repository secret:
#   SMOKESTACK_URL  — e.g. https://smokestack.internal or http://your-server:3000
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Manual trigger only — requires SMOKESTACK_URL secret to point at a hosted instance.
  # Remove this comment and add a push/pull_request trigger once you have hosting set up.
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        default: "smoke"
      environment:
        description: "Target environment"
        required: true
        default: "staging"

env:
  SMOKESTACK_URL: ${{ secrets.SMOKESTACK_URL }}
  SUITE:         ${{ github.event.inputs.suite       || 'smoke' }}
  ENVIRONMENT:   ${{ github.event.inputs.environment || 'staging' }}
  POLL_INTERVAL: 5    # seconds between status checks
  MAX_WAIT:      300  # seconds before giving up

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Replace this step with your actual deployment ──────────────────────
      - name: Deploy application
        run: |
          echo "Deploying to $ENVIRONMENT..."
          echo "(Replace this step with your actual deploy command)"
          echo "e.g. kubectl apply, helm upgrade, eb deploy, etc."

  smoke-test:
    name: Smoke test via SmokeStack
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      # ── 1. Trigger a run ────────────────────────────────────────────────────
      - name: Trigger test suite
        id: trigger
        run: |
          echo "Triggering suite '$SUITE' against '$ENVIRONMENT'..."

          RESPONSE=$(curl -sf -X POST "$SMOKESTACK_URL/api/runs" \
            -H "Content-Type: application/json" \
            -d "{\"suite\":\"$SUITE\",\"environment\":\"$ENVIRONMENT\"}")

          echo "$RESPONSE" | jq .

          RUN_ID=$(echo "$RESPONSE" | jq -r .id)
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error ::Failed to create run — check SMOKESTACK_URL and suite name"
            exit 1
          fi

          echo "run_id=$RUN_ID"   >> "$GITHUB_OUTPUT"
          echo "Run ID: $RUN_ID"
          echo "Dashboard: $SMOKESTACK_URL/#/runs/$RUN_ID"

      # ── 2. Poll until complete ───────────────────────────────────────────
      - name: Poll for completion
        id: result
        run: |
          RUN_ID="${{ steps.trigger.outputs.run_id }}"
          ELAPSED=0

          echo "Polling every ${POLL_INTERVAL}s (max ${MAX_WAIT}s)..."

          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            RUN=$(curl -sf "$SMOKESTACK_URL/api/runs/$RUN_ID")
            STATUS=$(echo "$RUN" | jq -r .status)

            echo "  [${ELAPSED}s] $STATUS"

            case "$STATUS" in
              passed|failed|error)
                echo "$RUN" | jq '{status, total_tests, passed_tests, failed_tests, duration_ms}'
                echo "status=$STATUS"                                      >> "$GITHUB_OUTPUT"
                echo "total=$(echo "$RUN"  | jq -r '.total_tests  // 0')" >> "$GITHUB_OUTPUT"
                echo "passed=$(echo "$RUN" | jq -r '.passed_tests // 0')" >> "$GITHUB_OUTPUT"
                echo "failed=$(echo "$RUN" | jq -r '.failed_tests // 0')" >> "$GITHUB_OUTPUT"
                echo "duration=$(echo "$RUN" | jq -r '.duration_ms // 0')" >> "$GITHUB_OUTPUT"
                break
                ;;
            esac

            sleep "$POLL_INTERVAL"
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
            echo "::error ::Timed out waiting for run to complete after ${MAX_WAIT}s"
            exit 1
          fi

      # ── 3. Annotate the job with results ────────────────────────────────────
      - name: Annotate results
        run: |
          STATUS="${{ steps.result.outputs.status }}"
          TOTAL="${{ steps.result.outputs.total }}"
          PASSED="${{ steps.result.outputs.passed }}"
          FAILED="${{ steps.result.outputs.failed }}"
          DURATION="${{ steps.result.outputs.duration }}"
          RUN_ID="${{ steps.trigger.outputs.run_id }}"

          echo "### SmokeStack Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Suite | \`$SUITE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`$ENVIRONMENT\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | **$STATUS** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tests | $PASSED/$TOTAL passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Duration | ${DURATION}ms |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run ID | \`$RUN_ID\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Report | [$SMOKESTACK_URL/#/runs/$RUN_ID]($SMOKESTACK_URL/#/runs/$RUN_ID) |" >> "$GITHUB_STEP_SUMMARY"

      # ── 4. Print logs on failure ─────────────────────────────────────────
      - name: Print run logs (on failure)
        if: steps.result.outputs.status != 'passed'
        run: |
          RUN_ID="${{ steps.trigger.outputs.run_id }}"
          echo "=== Run logs ==="
          curl -sf "$SMOKESTACK_URL/api/runs/$RUN_ID/logs" | jq -r .log_output

      # ── 5. Gate: fail the pipeline if tests failed ───────────────────────
      - name: Assert tests passed
        run: |
          STATUS="${{ steps.result.outputs.status }}"
          FAILED="${{ steps.result.outputs.failed }}"
          RUN_ID="${{ steps.trigger.outputs.run_id }}"

          if [ "$STATUS" != "passed" ]; then
            echo "::error ::$FAILED test(s) failed — release blocked"
            echo "::error ::Full report: $SMOKESTACK_URL/#/runs/$RUN_ID"
            exit 1
          fi

          echo "All tests passed — release approved"
