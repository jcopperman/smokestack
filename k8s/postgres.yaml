apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: smokestack
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";
    CREATE TABLE IF NOT EXISTS runs (
        id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        suite         VARCHAR(100) NOT NULL,
        environment   VARCHAR(100) NOT NULL DEFAULT 'default',
        status        VARCHAR(20)  NOT NULL DEFAULT 'queued',
        total_tests   INTEGER,
        passed_tests  INTEGER,
        failed_tests  INTEGER,
        duration_ms   INTEGER,
        artifact_path TEXT,
        error_message TEXT,
        log_output    TEXT,
        created_at    TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at    TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_runs_created_at ON runs (created_at DESC);
    CREATE INDEX IF NOT EXISTS idx_runs_status ON runs (status);
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: smokestack
spec:
  serviceName: postgres-svc
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: smokestack
            - name: POSTGRES_USER
              value: smokestack
            - name: POSTGRES_PASSWORD
              value: smokestack
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "smokestack"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: smokestack
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
