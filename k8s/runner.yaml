apiVersion: apps/v1
kind: Deployment
metadata:
  name: smokestack-runner
  namespace: smokestack
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smokestack-runner
  template:
    metadata:
      labels:
        app: smokestack-runner
    spec:
      containers:
        - name: runner
          image: smokestack-runner:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: smokestack-config
          # Examples are baked into the image at /suites — no extra volume needed.
          # Scale replicas here to increase test execution concurrency.
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: artifacts-pvc
