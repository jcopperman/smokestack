apiVersion: apps/v1
kind: Deployment
metadata:
  name: smokestack-runner
  namespace: smokestack
spec:
  # Replica count is managed by the KEDA ScaledObject in keda-scaler.yaml.
  # Starts at 0 (idle); KEDA scales up when jobs enter the queue, back to 0 when empty.
  # Without KEDA, set this to the desired static replica count.
  replicas: 0
  selector:
    matchLabels:
      app: smokestack-runner
  template:
    metadata:
      labels:
        app: smokestack-runner
    spec:
      # Allow enough time for an in-progress test to finish before force-kill.
      # Must exceed the longest expected suite duration (k6-demo ~40s + buffer).
      terminationGracePeriodSeconds: 120
      containers:
        - name: runner
          image: smokestack-runner:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: smokestack-config
          # Examples are baked into the image at /suites — no extra volume needed.
          # Scale replicas here to increase test execution concurrency.
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: artifacts-pvc
